<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - Barbería</title>

    <!-- CONFIGURACIÓN PWA CLIENTE -->
    <link rel="manifest" href="/manifest-cliente.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#070a12">

    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-cliente {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 22px;
            color: #ffffff;
        }

        p.sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        /* Botón de instalación PWA visible */
        #btnInstalarCliente {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body>

    <div class="card-cliente">
        <!-- BOTÓN DE INSTALACIÓN PWA CLIENTE -->
        <button id="btnInstalarCliente" type="button">📲 Instalar App de Citas</button>

        <h2 id="nombreBarberiaCliente">💈 Citas Barbería</h2>
        <p class="sub">Agenda tu turno en línea fácil y rápido</p>

        <form id="formCitaCliente">
            <label>Tu Nombre Completo</label>
            <input type="text" id="clienteNombre" placeholder="Ej. Carlos Pérez" required>

            <label>Teléfono de Contacto</label>
            <input type="tel" id="clienteTelefono" placeholder="Ej. 3001234567" required>

            <label>Seleccionar Servicio</label>
            <select id="selectServicioCliente" required>
                <option value="">Cargando servicios...</option>
            </select>

            <label>Seleccionar Barbero</label>
            <select id="selectBarberoCliente">
                <option value="">Cargando barberos...</option>
            </select>

            <label>Fecha y Hora Deseada</label>
            <input type="datetime-local" id="fechaHoraCliente" required>

            <button type="submit">Confirmar y Agendar Cita</button>
        </form>
    </div>

    <script>
        // Registrar Service Worker para PWA
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalarCliente');

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registrado cliente:', reg.scope))
                    .catch(err => console.error('Error SW:', err));
            });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.style.display = 'flex';
        });

        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalar.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert('Para instalar la aplicación:\n\n1. Toca los tres puntos (⋮) en la esquina superior derecha del navegador Chrome.\n2. Selecciona "Instalar aplicación" o "Agregar a la pantalla principal".');
            }
        });

        // Obtener ID de barbería de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const barberiaId = urlParams.get('id');

        async function cargarBarberiaCliente() {
            if (!barberiaId) {
                alert('Enlace inválido. Falta el ID de la barbería.');
                return;
            }

            try {
                const res = await fetch(`/api/barberia/${barberiaId}`);
                if (!res.ok) {
                    alert('La barbería seleccionada no existe o fue desactivada.');
                    return;
                }
                const data = await res.json();
                if (data.success && data.barberia) {
                    const b = data.barberia;
                    document.getElementById('nombreBarberiaCliente').innerText = `💈 ${b.nombre || 'Barbería'}`;

                    const selectS = document.getElementById('selectServicioCliente');
                    selectS.innerHTML = '<option value="">Seleccionar Servicio...</option>';
                    (b.servicios || []).forEach(s => {
                        selectS.innerHTML += `<option value="${s.nombre} - $${s.precio}">${s.nombre} ($${Number(s.precio).toLocaleString()})</option>`;
                    });

                    const selectB = document.getElementById('selectBarberoCliente');
                    selectB.innerHTML = '<option value="General">Cualquier Barbero Disponible</option>';
                    (b.barberos || []).forEach(barb => {
                        selectB.innerHTML += `<option value="${barb.nombre}">${barb.nombre}</option>`;
                    });
                }
            } catch (err) {
                console.error('Error cargando la barbería:', err);
            }
        }

        document.getElementById('formCitaCliente').addEventListener('submit', async (e) => {
            e.preventDefault();
            const clienteNombre = document.getElementById('clienteNombre').value;
            const clienteTelefono = document.getElementById('clienteTelefono').value;
            const servicio = document.getElementById('selectServicioCliente').value;
            const barbero = document.getElementById('selectBarberoCliente').value;
            const fechaHora = document.getElementById('fechaHoraCliente').value;

            try {
                const res = await fetch(`/api/barberias/${barberiaId}/citas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clienteNombre, clienteTelefono, servicio, barbero, fechaHora })
                });

                const data = await res.json();
                if (data.success) {
                    alert('¡Tu cita ha sido agendada con éxito!');
                    document.getElementById('formCitaCliente').reset();
                } else {
                    alert(data.error || 'No se pudo agendar la cita.');
                }
            } catch (err) {
                console.error(err);
                alert('Error al conectar con el servidor.');
            }
        });

        window.addEventListener('DOMContentLoaded', cargarBarberiaCliente);
    </script>
</body>
</html>
