<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agendar Cita - Barbería</title>

    <!-- MANIFIESTO EXCLUSIVO PARA CLIENTES -->
    <link rel="manifest" href="/manifest-cliente.json">

    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#070a12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body { font-family: sans-serif; background: #070a12; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 450px; background: #0f172a; padding: 25px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-top: 10px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 10px; background: #1e293b; color: #fff; box-sizing: border-box; }
        button[type="submit"] { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        #btnInstalarAppCliente { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #10b981; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.4); display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="nombreBarberiaCliente" style="text-align:center; margin-bottom: 5px;">Cargando...</h2>
        <p style="text-align:center; font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Reserva tu cita fácilmente</p>

        <form id="formAgendarCita">
            <label>Tu Nombre</label>
            <input type="text" id="clienteNombre" placeholder="Ej. Carlos Pérez" required>
            <label>Tu Teléfono / WhatsApp</label>
            <input type="tel" id="clienteTelefono" placeholder="Ej. 3001234567" required>
            <label>Servicio</label>
            <select id="selectServicio" required><option value="">Cargando servicios...</option></select>
            <label>Barbero</label>
            <select id="selectBarbero"><option value="General">Cualquier barbero disponible</option></select>
            <label>Fecha y Hora</label>
            <input type="datetime-local" id="fechaHoraCita" required>
            <button type="submit">📅 Confirmar Cita</button>
        </form>
    </div>

    <button id="btnInstalarAppCliente" onclick="intentarInstalarCliente()">
        📲 Instalar App Barbería
    </button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let barberiaId = urlParams.get('id');

        if (barberiaId) {
            localStorage.setItem('clienteBarberiaId', barberiaId);
        } else {
            barberiaId = localStorage.getItem('clienteBarberiaId');
        }

        if (!barberiaId) {
            document.body.innerHTML = `<div style="text-align:center; color:white; padding:40px;"><h2>⚠️ Enlace requerido</h2><p style="color:#94a3b8;">Entra mediante el enlace compartido por tu barbero.</p></div>`;
            throw new Error("ID no encontrado");
        }

        if (!urlParams.get('id') && barberiaId) {
            window.history.replaceState({}, '', `/cliente.html?id=${barberiaId}`);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`/api/barberias/${barberiaId}`);
                const data = await res.json();
                if (!data.success) return;

                document.getElementById('nombreBarberiaCliente').innerText = data.nombre;
                const selS = document.getElementById('selectServicio');
                selS.innerHTML = '<option value="">Selecciona un servicio...</option>';
                (data.servicios || []).forEach(s => {
                    selS.innerHTML += `<option value="${s.nombre}">${s.nombre} - $${Number(s.precio).toLocaleString()}</option>`;
                });

                const selB = document.getElementById('selectBarbero');
                selB.innerHTML = '<option value="General">Cualquier barbero disponible</option>';
                (data.barberos || []).forEach(b => {
                    selB.innerHTML += `<option value="${b.nombre}">${b.nombre}</option>`;
                });
            } catch (err) { console.error(err); }
        });

        document.getElementById('formAgendarCita').addEventListener('submit', async (e) => {
            e.preventDefault();
            const clienteNombre = document.getElementById('clienteNombre').value;
            const clienteTelefono = document.getElementById('clienteTelefono').value;
            const servicio = document.getElementById('selectServicio').value;
            const barbero = document.getElementById('selectBarbero').value;
            const fechaHora = document.getElementById('fechaHoraCita').value;

            const res = await fetch(`/api/barberias/${barberiaId}/citas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ clienteNombre, clienteTelefono, servicio, barbero, fechaHora })
            });
            const data = await res.json();
            if (data.success) {
                alert("¡Cita agendada con éxito!");
                document.getElementById('formAgendarCita').reset();
            } else {
                alert(data.error || "No se pudo agendar");
            }
        });

        let deferredPromptCliente = null;
        const btnCliente = document.getElementById('btnInstalarAppCliente');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPromptCliente = e;
            if (btnCliente) btnCliente.style.display = 'flex';
        });

        async function intentarInstalarCliente() {
            if (deferredPromptCliente) {
                deferredPromptCliente.prompt();
                const { outcome } = await deferredPromptCliente.userChoice;
                if (outcome === 'accepted') if (btnCliente) btnCliente.style.display = 'none';
                deferredPromptCliente = null;
            } else {
                alert("📱 Para instalar la App de esta Barbería:\nToca los 3 puntos ⋮ en tu navegador y selecciona 'Instalar aplicación' o 'Agregar a la pantalla principal'.");
            }
        }
    </script>
</body>
</html>
