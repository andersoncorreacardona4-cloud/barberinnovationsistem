<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro y Administración - Barbería</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#070a12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body { font-family: sans-serif; background: #070a12; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 450px; background: #0f172a; padding: 25px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-top: 10px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 10px; background: #1e293b; color: #fff; box-sizing: border-box; }
        button[type="submit"] { width: 100%; padding: 14px; background: #3b82f6; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button[type="submit"]:disabled { background: #1e40af; opacity: 0.7; cursor: not-allowed; }
        #btnInstalarAppAdmin { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(59,130,246,0.4); display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align:center; margin-bottom: 5px;">💈 Registro de Barbería</h2>
        <p style="text-align:center; font-size: 12px; color: #94a3b8; margin-bottom: 20px;">Crea tu panel de administración</p>
        
        <form id="formRegistroBarberia">
            <label>Nombre del Local</label>
            <input type="text" id="nombreBarberia" placeholder="Ej. Barber King" required>
            <label>Dirección</label>
            <input type="text" id="direccion" placeholder="Ej. Calle 45">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="Ej. 3001234567">
            <label>PIN de Acceso</label>
            <input type="password" id="pinAdmin" placeholder="Ej. 1234" required>
            <button type="submit">Registrar y Crear Panel</button>
        </form>
    </div>

    <button id="btnInstalarAppAdmin" onclick="intentarInstalarAdmin()">
        📲 Instalar App Admin
    </button>

    <script>
        document.getElementById('formRegistroBarberia').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombreBarberia').value.trim();
            const direccion = document.getElementById('direccion').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const pin = document.getElementById('pinAdmin').value.trim();

            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerHTML;

            // Aviso visual si Render está despertando del modo reposo
            btnSubmit.innerHTML = "⏳ Despertando servidor en la nube...";
            btnSubmit.disabled = true;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 segundos de margen

                const res = await fetch('/api/barberias', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, direccion, telefono, pin }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);
                const data = await res.json();

                if (data.success) {
                    alert("¡Barbería registrada con éxito!");
                    window.location.href = `/admin.html?id=${data.barberiaId}`;
                } else {
                    alert(data.error || "Error al registrar");
                    btnSubmit.innerHTML = textoOriginal;
                    btnSubmit.disabled = false;
                }
            } catch (err) {
                console.error("Error:", err);
                if (err.name === 'AbortError') {
                    alert("El servidor tardó demasiado en responder. Por favor, intenta hacer clic en registrar nuevamente.");
                } else {
                    alert("El servidor se está reactivando. Inténtalo de nuevo en unos segundos.");
                }
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            }
        });

        let deferredPromptAdmin = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPromptAdmin = e;
        });

        async function intentarInstalarAdmin() {
            if (deferredPromptAdmin) {
                deferredPromptAdmin.prompt();
                const { outcome } = await deferredPromptAdmin.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('btnInstalarAppAdmin').style.display = 'none';
                }
                deferredPromptAdmin = null;
            } else {
                alert("📱 Para instalar la App Admin:\n\n1. Toca los 3 puntos (⋮) arriba a la derecha en tu navegador.\n2. Selecciona 'Instalar aplicación' o 'Agregar a la pantalla principal'.");
            }
        }
    </script>
</body>
</html>
