<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Barbería - Barber Innovation</title>
    <link rel="manifest" href="/manifest.json?v=8">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --barber-red: #dc2626;
            --barber-blue: #2563eb;
        }

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .header-section {
            width: 100%;
            height: 160px;
            background: radial-gradient(circle at center, #1e293b 0%, #070a12 100%);
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            position: relative;
            border-bottom: 2px solid var(--border-color);
        }

        .pole-wrapper {
            position: relative;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
        }

        .pole-cap {
            width: 52px;
            height: 14px;
            background: #94a3b8;
            border-radius: 6px 6px 2px 2px;
        }
        .pole-cap.bottom {
            border-radius: 2px 2px 6px 6px;
        }

        .pole-glass {
            width: 40px;
            height: 90px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: #ffffff;
        }

        .pole-stripes {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            height: 180px;
            background: repeating-linear-gradient(
                -45deg,
                var(--barber-red),
                var(--barber-red) 12px,
                #ffffff 12px,
                #ffffff 24px,
                var(--barber-blue) 24px,
                var(--barber-blue) 36px,
                #ffffff 36px,
                #ffffff 48px
            );
            animation: rotatePole 3s linear infinite;
            -webkit-animation: rotatePole 3s linear infinite;
        }

        @keyframes rotatePole {
            0% { transform: translateY(0); }
            100% { transform: translateY(24px); }
        }
        @-webkit-keyframes rotatePole {
            0% { -webkit-transform: translateY(0); }
            100% { -webkit-transform: translateY(24px); }
        }

        .form-content {
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 4px;
            text-align: center;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 14px;
            -webkit-appearance: none;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--barber-red) 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            -webkit-appearance: none;
        }

        .ios-prompt {
            display: none;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="pole-wrapper">
                <div class="pole-cap"></div>
                <div class="pole-glass">
                    <div class="pole-stripes"></div>
                </div>
                <div class="pole-cap bottom"></div>
            </div>
        </div>

        <div class="form-content">
            <div id="iosPrompt" class="ios-prompt">
                💡 Para instalar en iPhone: Pulsa <strong>Compartir</strong> ⎋ en Safari y selecciona <strong>"Agregar a inicio"</strong> ➕.
            </div>

            <h1>Registrar Barbería</h1>
            <p class="subtitle">Ingresa los datos para crear tu panel</p>

            <form id="formRegistro">
                <label>Nombre de la Barbería</label>
                <input type="text" id="nombreBarberia" placeholder="Ej. Barbería El Estilo" required>

                <label>Dirección / Ubicación</label>
                <input type="text" id="direccionBarberia" placeholder="Ej. Calle 10 # 40-20" required>

                <label>Teléfono / WhatsApp de Contacto</label>
                <input type="tel" id="telefonoBarberia" placeholder="Ej. 3001234567" required>

                <button type="submit" id="btnSubmit">Crear Mi Barbería y Entrar</button>
            </form>
        </div>
    </div>

    <script>
        // Detección segura de iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

        if (isIOS && !isStandalone) {
            document.getElementById('iosPrompt').style.display = 'block';
        }

        // Registro de Service Worker diferido para no bloquear la carga inicial en iPhone
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Desactivado temporalmente'));
            }
        });

        // Envío de formulario blindado con control de errores para Render
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Conectando con servidor...";

            const nombre = document.getElementById('nombreBarberia').value.trim();
            const direccion = document.getElementById('direccionBarberia').value.trim();
            const telefono = document.getElementById('telefonoBarberia').value.trim();

            try {
                // Petición con manejo básico de JSON
                const res = await fetch('/api/barberias/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ nombre, direccion, telefono })
                });

                if (!res.ok) {
                    throw new Error("El servidor tardó en responder o está despertando.");
                }

                const data = await res.json();

                if (data.success && data.barberiaId) {
                    localStorage.setItem('barberiaId', data.barberiaId);
                    window.location.href = `/admin.html?id=${data.barberiaId}`;
                } else {
                    alert(data.error || "Ocurrió un error al registrar.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Crear Mi Barbería y Entrar";
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Render se está reactivando (suele tomar unos segundos la primera vez). Por favor, presiona el botón de nuevo.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Crear Mi Barbería y Entrar";
            }
        });
    </script>
</body>
</html>
