    <link rel="manifest" href="/manifest.json?v=4">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            /* Colores del caramelo de barbero para acentos */
            --barber-red: #ef4444;
            --barber-blue: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Contenedor principal con sombra y fondo degradado */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.98);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            margin: 20px;
        }

        /* --- NUEVO: CABECERA VISUAL (Estilo de tu imagen) --- */
        .header-section {
            width: 100%;
            height: 200px; /* Ajusta la altura si lo prefieres */
            background-image: 
                /* Superposición oscura para que se vea el icono */
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(15, 23, 42, 1)),
                /* Imagen de fondo de ladrillos (puedes cambiar esta URL si tienes otra) */
                url('https://images.unsplash.com/photo-1599305090598-fe179d501227?q=80&w=600&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 3px solid transparent;
            /* Efecto de borde degradado con los colores de barbero */
            border-image: linear-gradient(to right, var(--barber-red), var(--barber-blue)) 1;
        }

        /* Icono de caramelo de barbero (Estilo CSS puro o imagen) */
        .barber-pole-icon {
            width: 80px;
            height: 130px;
            background: linear-gradient(
                -45deg,
                var(--barber-red) 25%,
                #fff 25%,
                #fff 50%,
                var(--barber-blue) 50%,
                var(--barber-blue) 75%,
                #fff 75%,
                #fff
            );
            background-size: 30px 30px;
            border-radius: 10px;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            position: relative;
        }

        .barber-pole-icon::before,

            left: -5px;
            width: calc(100% + 10px);
            height: 15px;
            background: #cbd5e1; /* Color metalizado */
            border-radius: 5px;
