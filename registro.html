<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Barbería - Barber Innovation</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
            color: #fff;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-install {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botón de instalación PWA previa si el navegador lo permite -->
        <button id="btnInstalarApp" class="btn-install">📲 Instalar App de Barbería</button>

        <h1>Registrar Barbería</h1>
        <p class="subtitle">Crea tu cuenta e ingresa de inmediato a tu panel de control</p>

        <form id="formRegistro">
            <label>Nombre de la Barbería</label>
            <input type="text" id="nombreBarberia" placeholder="Ej. Barbería El Estilo" required>

            <label>Teléfono / WhatsApp de Contacto</label>
            <input type="tel" id="telefonoBarberia" placeholder="Ej. 3001234567" required>

            <button type="submit">Crear Mi Barbería y Entrar</button>
        </form>
    </div>

    <script>
        // Lógica de PWA (Instalación de la App)
        let deferredPrompt = null;
        const btnInstalarApp = document.getElementById('btnInstalarApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalarApp.style.display = 'block';
        });

        btnInstalarApp.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalarApp.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW Error:', err));
        }

        // Procesar Registro de Barbería
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombreBarberia').value.trim();
            const telefono = document.getElementById('telefonoBarberia').value.trim();

            try {
                const res = await fetch('/api/barberias/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, telefono })
                });

                const data = await res.json();

                if (data.success && data.barberiaId) {
                    // Guardar ID y redirigir directamente al panel de administración sin bucles
                    localStorage.setItem('barberiaId', data.barberiaId);
                    window.location.href = `/admin.html?id=${data.barberiaId}`;
                } else {
                    alert(data.error || "Ocurrió un error al registrar la barbería.");
                }
            } catch (err) {
                console.error("Error en registro:", err);
                alert("Error de conexión con el servidor.");
            }
        });
    </script>
</body>
</html>
