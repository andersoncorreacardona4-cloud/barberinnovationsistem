<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Barbería - Barber Innovation System</title>

    <!-- CONFIGURACIÓN PWA Y FAVICONS -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#070a12">

    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-registro {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p.sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Botón de instalación PWA siempre visible */
        #btnInstalarPWA {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="card-registro">
        <!-- BOTÓN PWA VISIBLE -->
        <button id="btnInstalarPWA" type="button">
            <span>📲</span> Instalar App en tu Celular
        </button>

        <h2>💈 Registro de Barbería</h2>
        <p class="sub">Crea tu panel de administración</p>

        <form id="formRegistro">
            <label>Nombre del Local</label>
            <input type="text" id="nombre" placeholder="Ej. Barber King" required>

            <label>Dirección</label>
            <input type="text" id="direccion" placeholder="Ej. Calle 45 #12-34">

            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="Ej. 3001234567">

            <label>PIN de Acceso</label>
            <input type="password" id="pin" placeholder="Ej. 1234" required>

            <button type="submit">Crear Mi Barbería</button>
        </form>
    </div>

    <script>
        let deferredPrompt;
        const btnInstalar = document.getElementById('btnInstalarPWA');

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registrado:', reg.scope))
                    .catch(err => console.error('Error Service Worker:', err));
            });
        }

        // Capturar evento de instalación del navegador
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalar.style.display = 'flex';
        });

        // Acción al hacer clic en el botón de instalación
        btnInstalar.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('Usuario aceptó instalar la PWA');
                    btnInstalar.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                alert('Para instalar la aplicación, toca los tres puntos (⋮) en la esquina superior derecha de tu navegador Chrome y selecciona "Instalar aplicación" o "Agregar a la pantalla principal".');
            }
        });

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const direccion = document.getElementById('direccion').value;
            const telefono = document.getElementById('telefono').value;
            const pin = document.getElementById('pin').value;

            try {
                const res = await fetch('/api/barberias/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, direccion, telefono, pin })
                });

                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('barberiaId', data.barberiaId);
                    window.location.href = `/admin.html?id=${data.barberiaId}`;
                } else {
                    alert(data.error || 'Error al registrar la barbería');
                }
            } catch (err) {
                console.error(err);
                alert('Error al conectar con el servidor.');
            }
        });
    </script>
</body>
</html>
