<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Barbería - Barber Innovation</title>

    <!-- CONFIGURACIÓN PWA E ICONOS -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/1001/1001371.png?v=BarberIconFix">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1001/1001371.png?v=BarberIconFix">
    <link rel="manifest" href="/manifest.json?v=BarberIconFix">
    
    <meta name="theme-color" content="#070a12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BarberApp">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --border-focus: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
        }

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            max-width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                linear-gradient(to right, rgba(30, 41, 59, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(30, 41, 59, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: var(--text-main);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.15);
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ef4444, #ffffff, #2563eb, #ef4444);
            background-size: 300% 100%;
            animation: barberPole 3s linear infinite;
        }

        @keyframes barberPole {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .header-panel {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 22px;
            margin-bottom: 28px;
        }

        .barber-logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #1e40af 0%, #0e7490 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            box-shadow: 0 8px 20px rgba(14, 116, 144, 0.4);
            border: 2px solid rgba(6, 182, 212, 0.4);
            margin: 0 auto 15px auto;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            font-weight: 800;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            margin-top: 14px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            background-color: var(--bg-input);
            color: var(--text-main);
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }

        input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        button, .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
            -webkit-appearance: none;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* BOTÓN FLOTANTE PWA (OCULTO POR DEFECTO HASTA QUE EL NAVEGADOR LO PERMITA) */
        #btnInstalarApp {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
            cursor: pointer;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-panel">
            <div class="barber-logo-icon">💈</div>
            <h1>Barber Innovation</h1>
            <p class="subtitle">Registra tu Barbería y empieza a gestionar tu negocio</p>
        </div>

        <form id="formRegistroBarberia">
            <label for="nombreLocal">Nombre de la Barbería</label>
            <input type="text" id="nombreLocal" placeholder="Ej. Barbería El Imperio" required>

            <label for="direccionLocal">Dirección / Sede</label>
            <input type="text" id="direccionLocal" placeholder="Ej. Calle 10 #45-12">

            <label for="telefonoLocal">Teléfono / WhatsApp</label>
            <input type="tel" id="telefonoLocal" placeholder="Ej. 3001234567">

            <label for="pinAdmin">PIN de Acceso Administrador (4 dígitos)</label>
            <input type="password" id="pinAdmin" placeholder="Ej. 1234" maxlength="4" required>

            <button type="submit" id="btnSubmitRegistro">💈 Registrar mi Barbería</button>
        </form>
    </div>

    <!-- BOTÓN FLOTANTE PWA -->
    <button id="btnInstalarApp">
        📲 Instalar App
    </button>

    <script>
        // REDIRECCIÓN SI YA TIENE SESIÓN ACTIVA
        const barberiaGuardada = localStorage.getItem('barberiaId');
        if (barberiaGuardada) {
            window.location.replace(`/admin.html?id=${barberiaGuardada}`);
        }

        // REGISTRO DE FORMULARIO
        document.getElementById('formRegistroBarberia').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnSubmitRegistro');
            btn.disabled = true;
            btn.innerText = "Registrando barbería...";

            const nombre = document.getElementById('nombreLocal').value.trim();
            const direccion = document.getElementById('direccionLocal').value.trim();
            const telefono = document.getElementById('telefonoLocal').value.trim();
            const pin = document.getElementById('pinAdmin').value.trim();

            try {
                const res = await fetch('/api/barberias/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, direccion, telefono, pin })
                });

                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('barberiaId', data.barberiaId);
                    alert("¡Barbería registrada con éxito!");
                    window.location.replace(`/admin.html?id=${data.barberiaId}`);
                } else {
                    alert(data.error || "No se pudo completar el registro.");
                    btn.disabled = false;
                    btn.innerText = "💈 Registrar mi Barbería";
                }
            } catch (err) {
                console.error("Error en registro:", err);
                alert("Error de conexión con el servidor.");
                btn.disabled = false;
                btn.innerText = "💈 Registrar mi Barbería";
            }
        });

        // =========================================================
        // REGISTRO DEL SERVICE WORKER Y GESTIÓN DEL BOTÓN PWA
        // =========================================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js?v=BarberIconFix')
                    .then(reg => {
                        if (reg && reg.update) reg.update();
                        console.log('Service Worker registrado correctamente');
                    })
                    .catch(err => console.error('Error al registrar Service Worker:', err));
            });
        }

        let deferredPrompt = null;
        const btnInstalar = document.getElementById('btnInstalarApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevenir que el navegador muestre su banner predeterminado
            e.preventDefault();
            // Guardar el evento para dispararlo con nuestro botón
            deferredPrompt = e;
            // Mostrar nuestro botón flotante verde
            if (btnInstalar) {
                btnInstalar.style.display = 'flex';
            }
        });

        if (btnInstalar) {
            btnInstalar.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('Usuario aceptó instalar la PWA');
                    }
                    deferredPrompt = null;
                    btnInstalar.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (btnInstalar) {
                btnInstalar.style.display = 'none';
            }
            deferredPrompt = null;
            console.log('PWA instalada con éxito');
        });
    </script>
</body>
</html>
