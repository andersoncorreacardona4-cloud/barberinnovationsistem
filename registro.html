<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Barbería - Barber Innovation</title>
    <link rel="manifest" href="/manifest.json?v=7">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --bg-input: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --barber-red: #dc2626;
            --barber-blue: #2563eb;
        }

        * {
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- CABECERA ESTÉTICA CON CARAMELO DE BARBERO MEJORADO --- */
        .header-section {
            width: 100%;
            height: 180px;
            background: radial-gradient(circle at center, #1e293b 0%, #070a12 100%);
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            position: relative;
            border-bottom: 2px solid var(--border-color);
        }

        /* Soporte del poste de barbero */
        .pole-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
        }

        /* Tapas metálicas cromadas (Arriba y Abajo) */
        .pole-cap {
            width: 58px;
            height: 16px;
            background: linear-gradient(180deg, #f1f5f9 0%, #94a3b8 50%, #475569 100%);
            border-radius: 8px 8px 3px 3px;
            border: 1px solid #cbd5e1;
            z-index: 2;
        }
        .pole-cap.bottom {
            border-radius: 3px 3px 8px 8px;
        }

        .pole-globe {
            width: 32px;
            height: 14px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            border-radius: 50% 50% 0 0;
            margin-bottom: -2px;
        }

        /* Cilindro de cristal con animación de rotación */
        .pole-glass {
            width: 46px;
            height: 110px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 0 15px rgba(59, 130, 246, 0.2);
            background: #ffffff;
        }

        /* Franjas giratorias del caramelo */
        .pole-stripes {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            height: 220px;
            background: repeating-linear-gradient(
                -45deg,
                var(--barber-red),
                var(--barber-red) 15px,
                #ffffff 15px,
                #ffffff 30px,
                var(--barber-blue) 30px,
                var(--barber-blue) 45px,
                #ffffff 45px,
                #ffffff 60px
            );
            animation: rotatePole 3s linear infinite;
        }

        /* Efecto de brillo de cristal 3D */
        .pole-glass::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                rgba(0,0,0,0.4) 0%,
                rgba(255,255,255,0.6) 25%,
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.3) 100%
            );
            pointer-events: none;
        }

        @keyframes rotatePole {
            0% { transform: translateY(0); }
            100% { transform: translateY(42px); }
        }

        .calendar-badge {
            position: absolute;
            top: 15px;
            right: 18px;
            font-size: 22px;
        }

        /* --- FORMULARIO DE REGISTRO --- */
        .form-content {
            padding: 24px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
            text-align: center;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 14px;
            -webkit-appearance: none;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--barber-red) 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
            -webkit-appearance: none;
        }

        .btn-install {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--barber-blue) 0%, #1e3a8a 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            display: none;
        }

        .ios-prompt {
            display: none;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera Visual con Caramelo de Barbero Animado 3D -->
        <div class="header-section">
            <span class="calendar-badge">🗓️</span>
            
            <div class="pole-wrapper">
                <div class="pole-globe"></div>
                <div class="pole-cap"></div>
                <div class="pole-glass">
                    <div class="pole-stripes"></div>
                </div>
                <div class="pole-cap bottom"></div>
            </div>
        </div>

        <div class="form-content">
            <!-- PWA Android -->
            <button id="btnInstalarApp" class="btn-install">📲 Instalar App de Barbería</button>

            <!-- Guía iPhone -->
            <div id="iosPrompt" class="ios-prompt">
                💡 Para instalar en iPhone: Pulsa <strong>Compartir</strong> ⎋ en Safari y selecciona <strong>"Agregar a inicio"</strong> ➕.
            </div>

            <h1>Registrar Barbería</h1>
            <p class="subtitle">Ingresa los datos para crear tu panel de control</p>

            <form id="formRegistro">
                <label>Nombre de la Barbería</label>
                <input type="text" id="nombreBarberia" placeholder="Ej. Barbería El Estilo" required>

                <label>Dirección / Ubicación</label>
                <input type="text" id="direccionBarberia" placeholder="Ej. Calle 10 # 40-20" required>

                <label>Teléfono / WhatsApp de Contacto</label>
                <input type="tel" id="telefonoBarberia" placeholder="Ej. 3001234567" required>

                <button type="submit" id="btnSubmit">Crear Mi Barbería y Entrar</button>
            </form>
        </div>
    </div>

    <script>
        // Detección de iPhone
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

        if (isIOS && !isStandalone) {
            document.getElementById('iosPrompt').style.display = 'block';
        }

        // PWA Android
        let deferredPrompt = null;
        const btnInstalarApp = document.getElementById('btnInstalarApp');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstalarApp.style.display = 'block';
        });

        btnInstalarApp.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    btnInstalarApp.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                if (reg && reg.update) reg.update();
            }).catch(err => console.log('SW Error:', err));
        }

        // Proceso de Registro
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "Registrando...";

            const nombre = document.getElementById('nombreBarberia').value.trim();
            const direccion = document.getElementById('direccionBarberia').value.trim();
            const telefono = document.getElementById('telefonoBarberia').value.trim();

            try {
                const res = await fetch('/api/barberias/registrar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ nombre, direccion, telefono })
                });

                const data = await res.json();

                if (data.success && data.barberiaId) {
                    localStorage.setItem('barberiaId', data.barberiaId);
                    window.location.href = `/admin.html?id=${data.barberiaId}`;
                } else {
                    alert(data.error || "Ocurrió un error al registrar la barbería.");
                    btnSubmit.disabled = false;
                    btnSubmit.innerText = "Crear Mi Barbería y Entrar";
                }
            } catch (err) {
                console.error("Error en registro:", err);
                alert("Error de conexión con el servidor.");
                btnSubmit.disabled = false;
                btnSubmit.innerText = "Crear Mi Barbería y Entrar";
            }
        });
    </script>
</body>
</html>
